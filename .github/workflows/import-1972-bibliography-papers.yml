name: Import 1972 System 250 bibliography papers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: initial-project-structure

      - name: Download the nine papers in Schroeder's bibliography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources/1972

          download_archive_pdf () {
            identifier="$1"
            output="$2"
            metadata="$(mktemp)"
            curl --fail --location --retry 3 "https://archive.org/metadata/$identifier" -o "$metadata"
            url="$(python3 - "$metadata" "$identifier" <<'PY'
          import json, sys, urllib.parse
          meta=json.load(open(sys.argv[1]))
          ident=sys.argv[2]
          pdfs=[f for f in meta.get("files",[]) if str(f.get("name","")).lower().endswith(".pdf")]
          if not pdfs:
              raise SystemExit("No PDF found for "+ident)
          # Prefer an original PDF; otherwise use the largest available PDF scan/derivative.
          originals=[f for f in pdfs if f.get("source")=="original"]
          pool=originals or pdfs
          f=max(pool, key=lambda x:int(x.get("size",0) or 0))
          print("https://archive.org/download/%s/%s" % (ident, urllib.parse.quote(f["name"])))
          PY
          )"
            echo "Downloading $url"
            curl --fail --location --retry 3 "$url" -o "$output"
            test "$(head -c 4 "$output")" = "%PDF"
          }

          # Four ISS papers (MIT, June 1972) in one contemporary-paper collection scan:
          # Cotton; England (Operating System); Halton; Hemmings.
          download_archive_pdf "plessey-system-250-iss-papers" \
            "sources/1972/1972-06-System-250-ISS-Papers-MIT.pdf"

          # Four ICCC papers (Washington DC, October 1972) in one collection scan:
          # Cosserat; Crompton; Hamer-Hodges; Repton.
          download_archive_pdf "plessey-system-250-icc-papers" \
            "sources/1972/1972-10-System-250-ICCC-Papers-Washington-DC.pdf"

          # England's ninth paper, published in the Infotech State of the Art Report.
          download_archive_pdf "architectural-features-of-system-250" \
            "sources/1972/1972-England-Architectural-Features-of-System-250.pdf"

          file sources/1972/*.pdf
          ls -lh sources/1972/*.pdf

      - name: Commit bibliography papers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/1972/*.pdf
          if git diff --cached --quiet; then
            echo "Sources already present."
            exit 0
          fi
          git commit -m "Add 1972 papers from Schroeder System 250 bibliography"
          git push origin HEAD:initial-project-structure
