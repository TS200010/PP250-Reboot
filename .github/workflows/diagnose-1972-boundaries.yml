name: Diagnose 1972 paper page boundaries

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: initial-project-structure
      - name: Extract page-leading text
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python3 - <<'PY'
          import subprocess, re
          files=[
            "sources/1972/1972-06-System-250-ISS-Papers-MIT.pdf",
            "sources/1972/1972-10-System-250-ICCC-Papers-Washington-DC.pdf",
          ]
          for pdf in files:
              info=subprocess.check_output(["pdfinfo",pdf],text=True)
              n=int(re.search(r"^Pages:\s+(\d+)",info,re.M).group(1))
              print("\n====",pdf,"PAGES",n,"====")
              for p in range(1,n+1):
                  t=subprocess.check_output(["pdftotext","-f",str(p),"-l",str(p),"-layout",pdf,"-"],text=True,errors="ignore")
                  lines=[" ".join(x.split()) for x in t.splitlines() if x.strip()]
                  print(f"PAGE {p:03d}: "+" | ".join(lines[:8])[:1000])
          PY
